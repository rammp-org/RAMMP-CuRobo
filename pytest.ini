[pytest]
; -p no:anyio: the Jetson's user site carries an anyio pytest plugin built
; for a newer pytest than Ubuntu 22.04 ships — autoloading it crashes
; collection (ModuleNotFoundError: _pytest.scope).
; -p no:launch_testing -p no:launch_ros: with ROS on PYTHONPATH, pytest 9
; refuses their hooks at plugin load (PluginValidationError).
addopts = -p no:anyio -p no:launch_testing -p no:launch_ros
testpaths = core/tests
