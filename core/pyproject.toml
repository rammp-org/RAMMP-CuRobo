[build-system]
requires = ["setuptools>=70,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "rammp-curobo"
version = "1.0.0"
description = "Pure-Python cuRobo motion-planning core for the RAMMP Kinova Gen3 (no ROS imports)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# torch and cuRobo (nvidia_curobo, PINNED v0.7.8) are deliberately NOT listed:
# on the Jetson they come from the platform-specific pinned install documented
# in the repo README, and a pip resolver must never try to replace them.
dependencies = [
    "numpy",
    "PyYAML",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["rammp_curobo*"]

[tool.setuptools.package-data]
rammp_curobo = ["configs/*.yaml"]
