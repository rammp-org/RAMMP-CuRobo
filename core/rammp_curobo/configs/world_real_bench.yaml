# Real-bench collision world — table MEASURED 2026-08-24 by
# scripts/measure_bench.py from the registered Orbbec (top -0.027 m,
# plane of 240140 points). Re-run after moving the arm or the bench.
#
# Layout: `table` carries the TRUE surface height and is in the
# planner's no_pad_names (padding it would swallow the arm's own
# base spheres at z=-0.015 and break every start near home); the
# floor_* guards repeat the surface outside a 0.30 m square around
# the base and take normal world_padding — the hard keep-out over
# the real tabletop wherever the arm can swing.
#
# cuRobo v0.7.8 refuses an EMPTY world (silently keeps the previous
# one on update), so at minimum keep the pedestal + table entries.

base_frame: base_link

obstacles:
  - name: pedestal                   # the arm's mounting column (no_pad).
    position: [0.0, 0.0, -0.05]
    dims: [0.14, 0.14, 0.04]
  - name: table                      # TRUE surface height (no_pad).
    position: [0.488, -0.063, -0.057]
    dims: [1.68, 1.89, 0.06]
  - name: floor_front
    position: [0.738, -0.063, -0.057]
    dims: [1.18, 1.89, 0.06]
  - name: floor_back
    position: [-0.250, -0.063, -0.057]
    dims: [0.20, 1.89, 0.06]
  - name: floor_left
    position: [0.000, 0.517, -0.057]
    dims: [0.30, 0.73, 0.06]
  - name: floor_right
    position: [0.000, -0.580, -0.057]
    dims: [0.30, 0.86, 0.06]

objects: []

targets: []
