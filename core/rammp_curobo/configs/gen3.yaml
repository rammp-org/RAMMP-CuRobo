# Planner config for the RAMMP Kinova Gen3 7-DoF + Robotiq 2F-85.
#
#   from rammp_curobo import CuRoboPlanner
#   planner = CuRoboPlanner.from_config('gen3.yaml')
#
# robot/world resolve relative to this file's directory first, then the
# packaged defaults — copy this file next to your code and point `world` at
# your own scene to customize. Values not set here fall back to the same
# defaults (config.PLANNER_DEFAULTS); everything below is explicit on
# purpose so this file is the single reference for what the planner runs.

robot: robot_gen3_2f85.yaml          # baked cuRobo robot config (generated)
world: world_sim_kitchen.yaml        # collision world; swap for your scene

# Controller joint order — matches ros2_kortex and the MuJoCo sim alike.
joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6, joint_7]

# Kinova "Home" (bent elbow) — well-conditioned; the default start state and
# the IK retract/seed family. Keep in sync with the robot YAML's
# retract_config (the loader re-applies it there at startup anyway).
home_pose_rad: [0.0, 0.262, 3.142, -2.269, 0.0, 0.960, 1.571]

planner:
  interpolation_dt: 0.02             # dense waypoints replay smoothest on the JTC
  max_attempts: 8
  finetune_attempts: 5               # cuRobo default; lowering converts hard-goal
                                     # successes into failures (v0.7.8 discards the
                                     # valid trajectory when all attempts fail)
  enable_finetune: true              # false = ~2x faster planning, less smooth
  enable_graph: false                # KEEP OFF on Jetson: the PRM planner needs a
                                     # cuSOLVER newer than JetPack ships (torch.svd)
  collision_cache_obb: 60            # headroom for live set_world/update_world
                                     # additions (cache overflow raises)
  collision_cache_mesh: 10
  collision_activation_distance: 0.03  # soft standoff; default 0.025 grazes
  world_padding: 0.02                # metres per side on every collision box
  no_pad_names: [pedestal]           # the arm's own mount: padding it would put
                                     # every start state in collision
  joint_space_method: auto           # 'auto' = native plan_single_js (exact joint
                                     # goal; verified OK on the torch 2.10 jp6/cu126
                                     # wheel) with automatic 'fk_pose' fallback.
                                     # fk_pose alone reaches the POSE but redundancy
                                     # may pick another joint family — check
                                     # goal_mismatch_rad before executing.
  limit_clamp_rad: 0.05              # start/goal joints this far outside the model's
                                     # position limits are clamped inward (the real
                                     # Gen3 PARKS with joint_4 ~0.8 deg past cuRobo's
                                     # URDF bound); larger violations are refused
  warmup: true                       # first-run kernel compile at init, not mid-task

tool:
  # Sim-measured calibrations from RAMMP-Kinova, applied to authored
  # FINGERTIP goals. Both default 0.0 here: plan_to_pose then means the raw
  # cuRobo tool_frame pose. RAMMP-Kinova's sim values were spin_deg: 90.0
  # (physical gripper mounted 90° twisted vs the URDF) and tip_offset_m:
  # 0.021 (pad centers beyond tool_frame) — RE-MEASURE ON THE REAL ARM
  # before enabling either.
  spin_deg: 0.0
  tip_offset_m: 0.0

execution:
  # Execution-side time dilation (retime.py): the plan itself always runs at
  # full velocity_scale 1.0. 0.25 = quarter speed — the hardware bring-up
  # default per the safety plan; raise only after slow runs are clean.
  speed_scale: 0.25
  max_speed_scale: 1.0               # hard cap an executor must enforce
