# Planner config for the Gen3 on the MEBot wheelchair: the arm mounted at the
# RAMMS model pose, with the chair's drive base and its occupant in every
# collision world.
#
# THIS IS THIS CHECKOUT'S FIXTURE COPY, for the tests and sim/mebot_sim. The
# copy a robot runs lives with that robot, in rammp-deployments under
# config/robots/<robot>/curobo, bind-mounted at /config/robot (issue #19):
#
#   config:=/config/robot/curobo/gen3_mebot.yaml
#
# Keep this copy in step with the robot's by hand -- only the three layer
# files are generated. The deployment repo's CI composes its copy with the
# planner's own loaders, which catches a layer that no longer resolves or a
# world_padding the layers were not generated for.
#
# The two layers below are composed into EVERY world, set_world pushes
# included: a push replaces the scene, never these. The scene it replaces
# holds world_mebot.yaml's floor, so a pushed scene brings its own floor.
# Both layers are GENERATED by scripts/generate_layers.py from
# scripts/mebot_layers.yaml (the platform also from the MEBot URDF it pins):
# edit that file and run `make layers`; never hand-edit the layers.
#
# The bench retract (retract_config in robot_gen3_2f85.yaml, also cuRobo's IK
# seed) reaches into the padded person layer, so it is not a valid start
# state here: plan from the arm's measured state. A seed for the chair is #20.
#
# The person, and only the person, can be left out: for one world at a time,
# and from Python only (SetWorld has no field for it).
#
#   planner.update_world('world_mebot.yaml', ignore={'person'})
#
# The next push without the ignore brings the person back. Ignoring the
# platform is refused.
#
# Every unlisted knob inherits the defaults gen3.yaml spells out
# (config.PLANNER_DEFAULTS), world_padding 0.02 among them: the layers were
# generated for that padding, so changing it means regenerating them.

robot: robot_gen3_2f85.yaml
world: world_mebot.yaml
layers: [layer_mebot_platform.yaml, layer_mebot_person.yaml]
