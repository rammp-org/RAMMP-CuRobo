# Data of the MEBot sim stack (sim/mebot_sim). Written by hand: the postures
# of the seated stand-in, and the suite's thresholds. Below them, what
# `ros2 run mebot_sim find_pairs` found: where the simulated arm starts, and
# the requests run_suite flies.
#
# Joint values are radians for the arm and degrees for the stand-in, the
# DeepMind humanoid, whose joints these are. mebot_sim/scene.py poses it with
# them and then scales and seats it from scripts/mebot_layers.yaml: the
# occupant's sitting height, the seat pan, the backrest and the centreline.

standin:
  # Every posture sits: thighs forward, shins down.
  seated: {hip_y_right: -90, knee_right: -90, hip_y_left: -90, knee_left: -90}
  postures:
    # Hands on the thighs. The arm angles are the best of a seeded posture
    # search of the design phase.
    upright_lap:
      joints: {shoulder1_right: 44.4, shoulder2_right: -32.7, elbow_right: -21.0, shoulder1_left: 45.3, shoulder2_left: -27.5, elbow_left: -28.6}
    # The same hands, leaning 15 degrees forward: the whole body pitches
    # forward and the abdomen pitches back by as much, so the pelvis and the
    # legs stay level in the seat.
    lean_lap:
      pitch_deg: 15
      joints: {abdomen_y: -15, shoulder1_right: 44.4, shoulder2_right: -32.7, elbow_right: -21.0, shoulder1_left: 45.3, shoulder2_left: -27.5, elbow_left: -28.6}
    # Upper arms down, forearms forward at elbow height (on the armrests or
    # a joystick): a seeded search for elbows 0.26 m below the shoulders and
    # hands 0.27 m in front of the elbows.
    forearms_forward:
      joints: {shoulder1_right: 49.7, shoulder2_right: -25.1, elbow_right: -24.0, shoulder1_left: 49.9, shoulder2_left: -24.8, elbow_left: -14.0}

thresholds:
  # find_pairs: a pair's straight joint path takes MuJoCo's arm this deep or
  # deeper into the shape its layer covers (its contacts at each pose,
  # without physics) ...
  crossing_mm: 10.0
  # ... and no deeper than this into anything else.
  elsewhere_mm: 1.0
  # G6 (run_suite): a flight without contact comes to rest this close to its
  # plan's last point on every joint, or the sim did not fly the plan.
  end_error_rad: 0.05
  # G1 (check_layers), beside its gap: this much of the stand-in, in percent,
  # lies in the padded person layer itself, not in the arm's column (spec
  # 6.4 found 99.11 to 99.86) ...
  covered_pct: 99.0
  # ... and its volume is within this many percent of the humanoid's own
  # times its scale cubed: it is the whole humanoid, at the occupant's size.
  body_volume_pct: 2.0

# --- GENERATED by `ros2 run mebot_sim find_pairs` from here to the end: do not hand-edit ---
# Rerun find_pairs whenever the layers change: run_suite refuses
# requests found with other layer files than the committed ones.

# sha256 of the layer files they were found with
layers_sha256:
