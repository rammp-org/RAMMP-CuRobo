# A scene for the control planner (/rammp_curobo_control, gen3.yaml, which
# composes no layers of its own): the MEBot's floor layer alone, with no
# platform and no person. The same request planned here and with
# control_floor_platform.yaml differs by the platform layer alone.

# The layer is named by a path relative to THIS file, not by name: the MEBot
# layers are one robot's geometry and no longer ship in the package (issue
# #19), so a bare name would not resolve -- a layer is looked for next to the
# file that lists it and never in the working directory. This is the
# checkout's copy, the one `make layers` writes (stack.chair_dir), which
# mebot_sim always reads from the checkout it was built from.

base_frame: arm_mount

obstacles: []

layers: [../../../core/tests/data/mebot/layer_mebot_floor.yaml]
