# Physical Intel RealSense D405 bracket-mounted on the wrist.
# Driver:
#   ros2 launch realsense2_camera rs_launch.py camera_namespace:=d405 camera_name:=d405
# (topics verified live 2026-08-13: /d405/d405/depth/*, 848w @30 Hz, 16UC1)
#
# Mount estimated from photos (docs/Wrist_cam_*.jpg): the camera sits on
# top of the wrist directly above the Kinova vision module, lenses along
# the tool axis. Offsets vs end_effector_link (z = tool direction, +y =
# vision-module side): ~7.5 cm off-axis on the module side, lens face at
# ~the flange plane. Roll is set by the bare-table dry-capture check, not
# by eye — re-verify with `sweep_scan --dry-capture --debug` after ANY
# bracket change (a wrong mount shifts the whole world by exactly its
# error).
depth_topic: /d405/d405/depth/image_rect_raw
info_topic: /d405/d405/depth/camera_info
parent_frame: end_effector_link
mount_xyz: [0.0, 0.075, -0.005]
mount_quat_xyzw: [0.0, 0.0, 0.0, 1.0]
min_range: 0.07          # D405 is short-range: optimal 7-50 cm
max_range: 0.9           # accuracy degrades fast beyond ~1 m

# Driver-side contract, pushed by the cameras node and the seeker
# (survives driver restarts): passive-stereo defaults hallucinate depth
# on textureless surfaces (field 2026-08-19); High Accuracy returns
# holes instead. Cost: blank surfaces are seen only by their edges —
# keep the baseline world honest.
sensor_params:
  node: /d405/d405
  params:
    depth_module.visual_preset: 3
